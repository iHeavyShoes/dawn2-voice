name: gemini-live-chat
version: "0.5.0"
manifest_version: 1
kind: standalone
description: "Full-duplex live voice in Hermes Desktop that delegates every real request into the chat you have open (prompt.submit, surface voice-live, with the recent spoken turns as voice_context), so nothing said on the call is lost. Runs on a provider chain with automatic fallback, also mid-call: Gemini Live on a free key, then OpenAI Realtime on your ChatGPT/Codex sign-in, then Gemini Live on a paid key. Hebrew-first with live language switching, barge-in, transcript saved to the chat at hang-up, and a stop path that leaves no socket, peer connection, microphone or process behind. No credential reaches the renderer: it gets a single-use, setup-locked Gemini token or a short-lived OpenAI client secret that Hermes core signed for."
author: "iHeavyShoes"
license: MIT
tags: ["voice", "gemini", "openai", "live", "desktop", "speech", "hebrew", "realtime"]
requires_env:
  - name: GEMINI_API_KEY
    description: "Google AI Studio API key for the Gemini Live API (first provider of the chain, free tier)"
    url: "https://aistudio.google.com/apikey"
    secret: true
optional_env:
  - name: GEMINI_API_KEY_PAID
    description: "Optional: a billed Google AI Studio key, the last provider of the chain. Absent: skipped."
    url: "https://aistudio.google.com/apikey"
    secret: true
# The ChatGPT/Codex voice (provider openai-codex) never sees the Codex token: Hermes core signs one
# POST /v1/realtime/client_secrets per call (hermes_cli.plugin_provider_requests), which requires
# this declaration. Not signed in, or a Hermes without signed requests: the chain skips it.
requires_auth: ["openai-codex"]
# 0.21.5 (v2026.9.24) is the first release with ctx.onEvent, composer.actions and the
# `voice-live` prompt surface (voice_context) this plugin relies on.
requires_hermes: ">=0.21.5"
config_schema:
  providers: {type: str, default: "gemini-free,openai-codex,gemini-paid", label: "Voice providers (in order)", description: "Comma-separated fallback chain: gemini-free (GEMINI_API_KEY), openai-codex (your ChatGPT/Codex sign-in in Hermes), gemini-paid (GEMINI_API_KEY_PAID). The first that can serve takes the call; on quota, auth or connection failure (also mid-call) the call moves to the next."}
  openai_model: {type: str, default: "gpt-realtime-2.1", label: "OpenAI Realtime model", description: "Model for the openai-codex provider (gpt-realtime-*)"}
  openai_voice: {type: str, default: "auto", label: "OpenAI voice", description: "auto (cedar for a male persona, marin for a female one) or an OpenAI Realtime voice: alloy, ash, ballad, coral, echo, sage, shimmer, verse, marin, cedar"}
  model: {type: str, default: "gemini-3.8-live", label: "Live model", description: "Gemini Live model id. gemini-3.8-live is the most reliable at delegating; -extended-thinking delegates far less often."}
  voice: {type: str, default: "auto", label: "Voice", description: "auto (Charon for a male persona, Aoede for a female one) or a Gemini prebuilt voice name (male: Charon, Puck, Fenrir, Orus, ...; female: Aoede, Kore, Leda, Zephyr, ...)"}
  persona_name: {type: str, default: "", label: "Persona name", description: "Who the voice is. Empty: the agent name from this profile's SOUL.md (e.g. Ray), else Hermes. Only the name is sent to Google."}
  persona_gender: {type: str, choices: ["auto", "male", "female"], default: "auto", label: "Persona gender", description: "Grammatical gender of the voice (Hebrew forms). auto: SOUL.md if it states one, else the chosen voice, else male."}
  language: {type: str, default: "he", label: "Starting language", description: "he, en, any BCP-47 code, or auto. The voice follows whichever language you speak."}
  transcription_languages: {type: str, default: "", label: "Transcription languages", description: "BCP-47 hints for input transcription, comma separated (he-IL, en-US). Empty: the starting language plus English/Hebrew. auto: no hints."}
  vocabulary: {type: str, default: "", label: "Vocabulary", description: "Comma-separated names and terms the input transcription should spell right (the persona name is always added)."}
  silence_ms: {type: int, default: 1000, label: "End-of-turn silence (ms)", description: "400-5000"}
  instructions: {type: str, default: "", label: "Extra instructions", description: "Appended to the voice persona"}
  transcript_to_chat: {type: str, choices: ["chat_turn", "file", "off"], default: "chat_turn", label: "Save the call transcript", description: "chat_turn: one queued turn in the open chat at hang-up; file: plugin data folder only; off"}
  half_duplex: {type: bool, default: false, label: "Half duplex", description: "Mute the mic while the voice speaks (for loudspeakers that defeat echo cancellation; disables barge-in)"}
  api_version: {type: str, choices: ["v1alpha", "v1beta"], default: "v1alpha", label: "API version", description: "Live API version for ephemeral tokens"}
provides_tools: []
provides_hooks: []
# No python_dependencies: the backend uses only the standard library plus FastAPI, which the
# Hermes gateway already ships.
